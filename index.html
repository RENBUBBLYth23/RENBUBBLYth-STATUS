<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ตรวจสอบสถานะ</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 50px;
  background: #f6f3ff;
}

h2 {
  color: #6a5acd;
}

input {
  padding: 12px;
  width: 260px;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 12px;
  background: #6a5acd;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#result {
  margin-top: 30px;
  background: white;
  padding: 20px;
  border-radius: 16px;
  width: 340px;
  margin-left: auto;
  margin-right: auto;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  text-align: left;
}
</style>
</head>

<body>

<h2>📦 ตรวจสอบสถานะคำสั่งซื้อ</h2>

<input type="text" id="username" placeholder="กรอก @username">
<button onclick="checkUser()">ตรวจสอบ</button>

<div id="result"></div>

<script>
const SHEET_ID = "15_loykx8PlnvWioDynhbk0qH7voRj_lsu-Imzkn6AB0";

// 🔥 ใช้ชื่อแท็บจริงของหนู
const SHEET_NAME = "สินค้าพร้อมส่ง by RENBUBBLYth🛍️";

const url = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(SHEET_NAME)}`;

async function checkUser() {
  let username = document.getElementById("username").value.trim();
  const result = document.getElementById("result");

  if (!username) {
    result.innerHTML = "⚠️ กรุณากรอก username";
    return;
  }

  if (!username.startsWith("@")) {
    username = "@" + username;
  }

  result.innerHTML = "⏳ กำลังโหลด...";

  try {
    const res = await fetch(url);
    const data = await res.json();

    const user = data.find(row => row.username === username);

    if (!user) {
      result.innerHTML = "❌ ไม่พบข้อมูล";
      return;
    }

    // 🔥 ดึง address (ถ้าคอลัมน์ชื่อไทยจะใช้ได้ด้วย)
    const address = user.address || user["ที่อยู่การจัดส่ง"] || "-";

    let items = "";

    for (let key in user) {
      if (
        key !== "username" &&
        key !== "name" &&
        key !== "address" &&
        key !== "ที่อยู่การจัดส่ง" &&
        key !== "สถานะ" &&
        key !== "" &&
        user[key] !== "ไม่รับ" &&
        user[key] !== ""
      ) {
        items += `• ${key} (${user[key]}) <br>`;
      }
    }

    result.innerHTML = `
      <b>👤 X, Twitter:</b> ${user.username} <br>
      <b>📌 ที่อยู่การจัดส่ง:</b> ${address} <br><br>

      <b>🛍️ รายการสั่งซื้อ:</b><br>
      ${items || "ไม่มีรายการ"}<br><br>

      <b>📦 สถานะ:</b> ${user.สถานะ}
    `;

  } catch (error) {
    result.innerHTML = "❌ โหลดข้อมูลไม่สำเร็จ (เช็กว่าเปิด public แล้ว)";
  }
}
</script>

</body>
</html>
