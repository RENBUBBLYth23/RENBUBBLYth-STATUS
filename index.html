<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ตรวจสอบสถานะ</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 50px;
  background: #faf7ff;
}

h2 {
  color: #6a5acd;
}

input {
  padding: 12px;
  width: 250px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: #6a5acd;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-left: 5px;
}

button:hover {
  background: #5a4bcf;
}

#result {
  margin-top: 30px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 320px;
  margin-left: auto;
  margin-right: auto;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  text-align: left;
}
</style>
</head>

<body>

<h2>📦 ตรวจสอบสถานะคำสั่งซื้อ</h2>

<input type="text" id="username" placeholder="กรอก @username">
<button onclick="checkUser()">ตรวจสอบ</button>

<div id="result"></div>

<script>
const SHEET_ID = "15_loykx8PlnvWioDynhbk0qH7voRj_lsu-Imzkn6AB0";

// ❗ ถ้าชื่อชีตไม่ใช่ Sheet1 ให้เปลี่ยนตรงนี้
const SHEET_NAME = "ชีตสถานะ";

const url = `https://opensheet.elk.sh/${SHEET_ID}/${ชีตสถานะ}`;

async function checkUser() {
  let username = document.getElementById("username").value.trim();
  const result = document.getElementById("result");

  if (!username) {
    result.innerHTML = "⚠️ กรุณากรอก username";
    return;
  }

  // รองรับพิมพ์ไม่มี @
  if (!username.startsWith("@")) {
    username = "@" + username;
  }

  result.innerHTML = "⏳ กำลังโหลด...";

  try {
    const res = await fetch(url);
    const data = await res.json();

    const user = data.find(row => row.username === username);

    if (!user) {
      result.innerHTML = "❌ ไม่พบข้อมูล";
      return;
    }

    let items = "";

    for (let key in user) {
      if (
        key !== "username" &&
        key !== "name" &&
        key !== "สถานะ" &&
        user[key] !== "ไม่รับ" &&
        user[key] !== ""
      ) {
        items += `• ${key} (${user[key]}) <br>`;
      }
    }

    result.innerHTML = `
  <b>👤 X, Twitter:</b> ${user.username} <br>
  <b>📌 ที่อยู่การจัดส่ง:</b> ${user.address || "-"} <br><br>

  <b>🛍️ รายการสั่งซื้อ:</b><br>
  ${items || "ไม่มีรายการ"}<br><br>

  <b>📦 สถานะ:</b> ${user.สถานะ}
`;

  } catch (error) {
    result.innerHTML = "❌ โหลดข้อมูลไม่สำเร็จ (เช็กชีตว่าเปิด public หรือยัง)";
  }
}
</script>

</body>
</html>
