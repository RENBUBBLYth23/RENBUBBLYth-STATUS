<script>
const SHEET_ID = "15_loykx8PlnvWioDynhbk0qH7voRj_lsu-Imzkn6AB0";
const url = `https://opensheet.elk.sh/${SHEET_ID}/1`;

async function checkUser() {
  let username = document.getElementById("username").value.trim();
  const result = document.getElementById("result");

  if (!username) {
    result.innerHTML = "⚠️ กรุณากรอก username";
    return;
  }

  if (!username.startsWith("@")) {
    username = "@" + username;
  }

  result.innerHTML = "⏳ กำลังโหลด...";

  try {
    const res = await fetch(url);
    const data = await res.json();

    // 🔍 หา user (คอลัมน์ E)
    const user = data.find(row => {
      const val = (row["X , Twitter ที่สามารถติดต่อได้"] || "")
        .toLowerCase()
        .replace(/\s/g, "");
      return val === username.toLowerCase().replace(/\s/g, "");
    });

    if (!user) {
      result.innerHTML = "❌ ไม่พบข้อมูล";
      return;
    }

    // 📌 ที่อยู่ (F)
    const address = user["ที่อยู่การจัดส่ง"] || "-";

    // 📦 สถานะ (AC)
    const status = user["สถานะการสั่งซื้อ"] || "-";

    // 📮 เลขพัสดุ (AD)
    const tracking = user["เลขพัสดุ"] || "-";

    // 🛍️ สินค้า (H - W)
    let items = "";
    for (let key in user) {
      if (
        key !== "ORDER NO." &&
        key !== "X , Twitter ที่สามารถติดต่อได้" &&
        key !== "ที่อยู่การจัดส่ง" &&
        key !== "สถานะการสั่งซื้อ" &&
        key !== "เลขพัสดุ" &&
        key !== "ประทับเวลา" &&
        key !== "ที่อยู่อีเมล" &&
        user[key] !== "ไม่รับ" &&
        user[key] !== "" &&
        user[key] != null
      ) {
        items += `• ${key} (${user[key]}) <br>`;
      }
    }

    result.innerHTML = `
      <b>👤 X, Twitter:</b> ${username}<br>
      <b>📌 ที่อยู่:</b> ${address}<br><br>

      <b>🛍️ รายการ:</b><br>
      ${items || "ไม่มีรายการ"}<br><br>

      <b>📦 สถานะ:</b> ${status}<br>
      <b>📮 เลขพัสดุ:</b> ${tracking}
    `;

  } catch (error) {
    result.innerHTML = "❌ โหลดข้อมูลไม่สำเร็จ (เช็ก public)";
    console.error(error);
  }
}
</script>
