<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ตรวจสอบสถานะคำสั่งซื้อ</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f6f3ff;
    text-align: center;
    padding: 60px 20px;
  }
  h2 { color:#6a5acd; }
  .box {
    margin-top:20px;
  }
  input {
    padding:12px;
    width:260px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
  }
  button {
    padding:12px 18px;
    border:none;
    border-radius:12px;
    background:#6a5acd;
    color:#fff;
    font-size:16px;
    cursor:pointer;
  }
  #result {
    margin-top:30px;
    background:#fff;
    padding:20px;
    border-radius:16px;
    width:340px;
    margin-left:auto;
    margin-right:auto;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:left;
  }
</style>
</head>

<body>

<h2>📦 ตรวจสอบสถานะคำสั่งซื้อ</h2>

<div class="box">
  <input type="text" id="username" placeholder="กรอก @username">
  <button onclick="checkUser()">ตรวจสอบ</button>
</div>

<div id="result"></div>

<script>
const SHEET_ID = "1n0iXxWqpUv9uxei_pnMLuRD8NKvsOYZ_pcXU6J1EBMo";
const SHEET_NAME = "สำเนาของ การตอบแบบฟอร์ม 4";

// ⭐ ใช้ URL นี้เท่านั้น
const url = `https://opensheet.elk.sh/${SHEET_ID}/${encodeURIComponent(SHEET_NAME)}`;

async function checkUser() {
  let username = document.getElementById("username").value.trim();
  const result = document.getElementById("result");

  if (!username) {
    result.innerHTML = "⚠️ กรุณากรอก username";
    return;
  }

  if (!username.startsWith("@")) {
    username = "@" + username;
  }

  result.innerHTML = "⏳ กำลังโหลด...";

  try {
    const res = await fetch(url);
    const data = await res.json();

    // 🔥 คอลัมน์จริงของหนู
    const user = data.find(row =>
      row["X , Twitter ที่สามารถติดต่อได้"] === username
    );

    if (!user) {
      result.innerHTML = "❌ ไม่พบข้อมูล";
      return;
    }

    const address = user["ที่อยู่การจัดส่ง"] || "-";

    // 🔥 ดึงสถานะจากคอลัมน์ที่มีคำว่า “สถานะ”
    let status = "-";
    for (let key in user) {
      if (key.includes("สถานะ")) {
        status = user[key];
        break;
      }
    }

    let items = "";

    for (let key in user) {
      if (
        key !== "X , Twitter ที่สามารถติดต่อได้" &&
        key !== "ที่อยู่การจัดส่ง" &&
        !key.includes("สถานะ") &&
        key !== "ประทับเวลา" &&
        key !== "ที่อยู่อีเมล" &&
        user[key] !== "ไม่รับ" &&
        user[key] !== ""
      ) {
        items += `• ${key} (${user[key]}) <br>`;
      }
    }

    result.innerHTML = `
      <b>👤 X, Twitter:</b> ${username} <br>
      <b>📌 ที่อยู่การจัดส่ง:</b> ${address} <br><br>

      <b>🛍️ รายการสั่งซื้อ:</b><br>
      ${items || "ไม่มีรายการ"}<br><br>

      <b>📦 สถานะ:</b> ${status}
    `;

  } catch (error) {
    result.innerHTML = "❌ โหลดข้อมูลไม่สำเร็จ (ตรวจว่าเปิด public แล้ว)";
    console.error(error);
  }
}
</script>

</body>
</html>
